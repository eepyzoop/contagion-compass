services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contagion
      POSTGRES_PASSWORD: contagion
      POSTGRES_DB: contagion_compass
    ports:
      - "5432:5432"
    volumes:
      - contagion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contagion"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://contagion:contagion@postgres:5432/contagion_compass
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      S3_BUCKET: ${S3_BUCKET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./reports:/app/reports
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  contagion_pg_data:
